<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon: split-colour pot = two recipes cooked in one batch.
       Dark theme + accent-a (blue) / accent-b (red) + freeze (turquoise) steam.
       Full-bleed square so iOS can apply its own squircle mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242e"/>
      <stop offset="1" stop-color="#12151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="potClip">
      <path d="M150 262 H362 V344 Q362 388 318 388 H194 Q150 388 150 344 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Steam (turquoise accent) -->
  <g fill="none" stroke="#35d0ba" stroke-width="15" stroke-linecap="round">
    <path d="M212 210 C 196 188 228 172 212 150 C 200 132 224 118 214 100" opacity="0.9"/>
    <path d="M300 210 C 284 188 316 172 300 150 C 288 132 312 118 302 100" opacity="0.9"/>
  </g>

  <!-- Handles (echo the split colours) -->
  <rect x="120" y="286" width="34" height="46" rx="16" fill="#4c8dff"/>
  <rect x="358" y="286" width="34" height="46" rx="16" fill="#ff5c5c"/>

  <!-- Pot body, split blue | red down the middle -->
  <g clip-path="url(#potClip)">
    <rect x="0" y="255" width="256" height="140" fill="#4c8dff"/>
    <rect x="256" y="255" width="256" height="140" fill="#ff5c5c"/>
    <!-- inner shading for depth -->
    <rect x="0" y="255" width="512" height="140" fill="#000000" opacity="0.10"/>
    <rect x="150" y="255" width="212" height="16" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- Lid -->
  <rect x="136" y="236" width="240" height="30" rx="15" fill="#edeff3"/>
  <rect x="234" y="214" width="44" height="24" rx="12" fill="#edeff3"/>
</svg>
