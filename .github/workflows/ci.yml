name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build generated validator and service worker
        run: npm run build

      - name: Verify committed generated files are in sync with the build
        run: git diff --exit-code -- src/generated sw.js

      - name: Unit tests
        run: npm test

      - name: Scheduler property tests
        run: node test-scheduler.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Playwright
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Resolve Chromium executable path
        run: |
          CHROME=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          echo "CHEF_CHROMIUM=$CHROME" >> "$GITHUB_ENV"

      - name: Browser smoke test
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          SERVER=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ >/dev/null && break || sleep 1; done
          python tests/browser_smoke.py --base-url http://127.0.0.1:8000
          status=$?
          kill "$SERVER" 2>/dev/null || true
          exit $status

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
