name: Deploy to GitHub Pages

# One-time setup: Repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that, every push to main publishes the app.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the runtime assets the app and service worker reference
      # (the generated files are committed and verified in sync by CI).
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html kochmodus.html manifest.json sw.js recipes.json \
                icon.svg apple-touch-icon.png PROMPT_RECIPES.md \
                src schemas icons _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
